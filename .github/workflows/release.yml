name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # Chaquopy buildPython requirement

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # Fail here, not 7 minutes later inside AGP's ASN.1 parser: an unset
          # secret silently decodes to a 0-byte "keystore".
          missing=()
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          mkdir -p packing
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > packing/nexus_release.jks
          # Verifies the file really is a keystore, the password is right and the alias exists.
          keytool -list -keystore packing/nexus_release.jks \
            -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" > /dev/null

      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PRELEASE_STORE_PASSWORD="$SIGNING_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$SIGNING_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$SIGNING_KEY_PASSWORD"

      - name: Resolve version name
        id: version
        run: |
          VN=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "name=$VN" >> "$GITHUB_OUTPUT"

      - name: Stage APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "Zafiro-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Zafiro-${{ steps.version.outputs.name }}
          path: Zafiro-*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            Zafiro-*.apk \
            --title "${{ github.ref_name }}" \
            --generate-notes
